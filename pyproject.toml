[project]
name = "msuite-server"
version = "0.1.0"
description = "This is msuite server"
authors = [
    {name = "sumant1512",email = "sumantmishra511@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.124.4,<0.125.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0) ; python_version >= \"3.12\" and python_version < \"4.0\"",
    "python-multipart (>=0.0.21,<0.0.22)",
    "alembic (>=1.17.2,<2.0.0)",
    "bcrypt (>=4.0.1,<5.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
